server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Pretty URLs — fallback to .html if file not found
  location / {
    try_files $uri $uri/ $uri.html =404;
  }

  # WASM / Blazor need these headers for SharedArrayBuffer
  location /editor/ {
    add_header Cross-Origin-Opener-Policy "same-origin";
    add_header Cross-Origin-Embedder-Policy "require-corp";
    try_files $uri $uri/ /editor/blazor/index.html;
  }

  # Cache static assets
  location ~* \.(?:css|js|svg|woff2?|wasm)$ {
    expires 7d;
    add_header Cache-Control "public, must-revalidate";
  }

  # Correct MIME for WASM
  types {
    application/wasm wasm;
  }

  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml application/wasm;
  gzip_min_length 1024;
}
